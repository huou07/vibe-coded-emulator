# Gitleaks configuration.
#
# Two exact, path-scoped allowlists cover confirmed non-secret identifiers.
[extend]
useDefault = true

[[allowlists]]
description = "localStorage key-name assignment, not a secret"
paths = ['static/player-runtime\.js$']
regexTarget = "match"
regexes = ['an3-presentation-renderer-v1']

[[allowlists]]
description = "Vendored Vulkan extension identifier, not a credential"
paths = ['native-offline/vendor/moltenvk/macos-arm64/include/vulkan/vulkan_extension_inspection\.hpp$']
regexTarget = "match"
regexes = ['VK_NV_win32_keyed_mutex']
