# Gitleaks configuration.
#
# Three exact, path-scoped allowlists cover confirmed non-secret identifiers.
# Each names one identifier and the paths it legitimately appears on; a new path
# is added only after confirming the same identifier, never as a broad exclusion.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Rule-scoped AND keeps other secrets in these files detectable.
[[rules.allowlists]]
condition = "AND"
description = "localStorage key-name assignment, not a secret"
paths = ['static/player-runtime\.js$', 'tests/test_release_artifact_scan\.py$']
regexTarget = "match"
regexes = ['an3-presentation-renderer-v1']

[[rules.allowlists]]
condition = "AND"
description = "Vendored Vulkan extension identifier, not a credential"
paths = ['native-offline/vendor/moltenvk/macos-arm64/include/vulkan/vulkan_extension_inspection\.hpp$']
regexTarget = "match"
regexes = ['VK_NV_win32_keyed_mutex']
