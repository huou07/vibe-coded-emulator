# gitleaks configuration.
#
# gitleaks' generic-api-key rule flags high-entropy assignments. Every finding it
# reported on this line was read before this file was written, and none of them is
# a secret:
#
#   - tests/test_publication_gate.py writes the deliberately fake line
#     "AN3_AUTH_PEPPER=AbCdEf0123456789XYZ" to prove the publication gate refuses
#     an exposed pepper;
#   - reports/handoff/2026-09-17-qa/baseline-unittest.log is a recorded QA log
#     whose LAN-sync fixtures print generated hostToken and token values;
#   - native-offline/vendor/moltenvk/.../vulkan_extension_inspection.hpp names the
#     Vulkan extensions VK_NV_win32_keyed_mutex and VK_KHR_win32_keyed_mutex.
#
# The allowlist names those exact values instead of disabling the rule, excluding
# a directory or excluding a file, so a real secret anywhere — including on the
# same line as one of these fixtures — is still reported.
[extend]
useDefault = true

[allowlist]
description = "Non-secret fixtures and identifiers confirmed by reading each finding"
regexTarget = "line"
regexes = [
  '''AN3_AUTH_PEPPER=AbCdEf0123456789XYZ''',
  # the localStorage key name for the renderer choice; a name, not a value
  '''rendererStorageKey = "an3-presentation-renderer-v1"''',
  '''VK_NV_win32_keyed_mutex''',
  '''hostToken=DgiiCZPLrYC9IW5_CUnRY6vn0-u2u9ZoKWo3SqaMKBs''',
  '''hostToken=XkY3mPbsSTG3aC6reYhhQpBNIKo9PGsXhTpMiU-q5VE''',
  '''hostToken=wPe9Iovr_14bzM_2TZaBv2vus1vPy2X1NNBaR14cHAk''',
  '''token=H1zZBRoRrSCUOVzWVfWJ5nx3w02lvTLchdHtY78OSzc''',
  '''token=QjRkRM_mK_fbfyxUDQ3CtmEZmwxcn0IzpcJR9GeE87A''',
  '''token=RO5fC9IuECa1RFzuuYG871pKmhaOClthn8fWT185-Tc''',
  '''token=b-vpdqr7pnipAE7S9jGz7XznYokODVPJaMkvZSm0KDs''',
]
