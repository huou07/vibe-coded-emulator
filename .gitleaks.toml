# Gitleaks configuration.
#
# One narrowly scoped allowlist: `rendererStorageKey = "an3-presentation-renderer-v1"`
# in static/player-runtime.js is a localStorage key name, not a credential.
[extend]
useDefault = true

[[allowlists]]
description = "localStorage key-name assignment, not a secret"
paths = ['static/player-runtime\.js$']
regexTarget = "match"
regexes = ['an3-presentation-renderer-v1']
