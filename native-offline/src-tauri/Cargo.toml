[package]
name = "an3-offline-native"
version = "1.3.0"
description = "VibeCodedEmulator local-ROM offline player"
authors = ["Vibe Coded Emulator"]
edition = "2021"

[lib]
name = "an3_offline_native"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
