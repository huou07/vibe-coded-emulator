[package]
name = "an3-offline-native"
version = "3.3.0"
description = "VibeCodedEmulator local-ROM offline player"
authors = ["Vibe Coded Emulator"]
edition = "2021"

[lib]
name = "an3_offline_native"
crate-type = ["lib", "cdylib", "staticlib"]

# Release artifacts must not embed local Rust checkout paths in DWARF data.
# Keep the native ABI and symbols needed by the app, but strip debuginfo in the
# Cargo-produced shared library before it is copied into desktop/Android apps.
[profile.release]
strip = "debuginfo"

[features]
# Test-only structured UI control bridge (loopback, token-gated). Never enabled
# in a distribution build; the automation E2E builds with it.
ui-control = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# Direct LAN phone controller: standard primitives only (no custom crypto).
aes-gcm = "0.10"
base64 = "0.21"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
