name: Windows packaged runtime smoke

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Native-build run that produced the Windows installer
        required: true
        type: string
      expected_sha:
        description: Exact source SHA recorded by the Windows package job
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-runtime-smoke-${{ inputs.artifact_run_id }}
  cancel-in-progress: false

jobs:
  install-and-gameplay:
    name: Install Windows package and verify GBA runtime
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe
          path: artifacts/windows
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install and verify packaged Windows runtime
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: >-
          ./tools/windows-runtime-smoke.ps1
          -ArtifactDirectory artifacts/windows
          -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA
          -ArtifactRunId $env:ARTIFACT_RUN_ID
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-runtime-smoke-diagnostics
          path: ${{ runner.temp }}/vce-windows-runtime-smoke
          if-no-files-found: ignore
          retention-days: 3
