# Minimal CI: syntax/type checks and the test suite.
#
# Security notes for maintainers:
#   - Permissions are read-only; no job needs more.
#   - This workflow never deploys and never runs privileged code from forks.
#   - Third-party actions are pinned to immutable full commit SHAs (a moved tag
#     can never change what runs here). Update deliberately, not automatically.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Python syntax
        run: |
          python3 -m py_compile app.py netcode.py sync_engine.py google_sync.py qrcodegen.py
      - name: Player syntax
        run: node --check static/player.js
      - name: Tests
        run: python3 -m unittest discover -s tests
