# Native installers release (tags only).
#
# This is the ONLY workflow with a write scope. It runs on tags, builds the
# five packages through the reusable `native-build.yml` workflow (read-only),
# and then creates a DRAFT GitHub release with the built-in `GITHUB_TOKEN`.
#
# Security posture for maintainers:
#   - Triggered only by a pushed tag (`v*`); it never runs on pull requests.
#   - The build jobs are read-only because `native-build.yml` declares
#     `contents: read`. Only the final job raises a single, minimal
#     `contents: write` scope, which `gh release create` needs.
#   - The release is created as a draft, so a human decides whether to publish
#     it; this workflow never publishes automatically and never deploys.
#   - No signing identity and no `secrets.*` are referenced anywhere.
#   - Third-party actions are pinned to immutable full commit SHAs.
name: native-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-build.yml

  draft-release:
    name: Draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Collect and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Keep platform packages, checksums, and labels; exclude acceptance
          # APKs and short-lived emulator diagnostics.
          while IFS= read -r -d '' label; do
            platform="$(basename "$(dirname "$label")")"
            cp "$label" "dist/BUILD_LABELS-${platform}.txt"
          done < <(find dist -type f -name BUILD_LABELS.txt -print0)
          mapfile -d '' files < <(find dist -type f \
            \( -name '*.dmg' -o -name '*.dmg.sha256' \
            -o -name '*.deb' -o -name '*.deb.sha256' \
            -o -name '*.flatpak' -o -name '*.flatpak.sha256' \
            -o -name '*.exe' -o -name '*.exe.sha256' \
            -o -name '*-android-arm64-staging.apk' -o -name '*-android-arm64-staging.apk.sha256' \
            -o -name '*-android-arm64-staging.aab' -o -name '*-android-arm64-staging.aab.sha256' \
            -o -name 'BUILD_LABELS-*.txt' \) -print0 | sort -z)
          printf '%s\n' "${files[@]}"
          echo '--- labels ---'
          find dist -name BUILD_LABELS.txt -exec sh -c 'echo "[$1] $(cat "$1")"' _ {} \;
          cat > release-notes.md <<'NOTES'
          Native installers built from source by GitHub Actions.

          **The attached installers are UNSIGNED staging builds.** macOS bundles
          are ad-hoc signed only and not notarized, Android APKs use the
          auto-generated Android debug key, and the Linux DEB/Flatpak and
          Windows NSIS packages carry no distribution or Authenticode
          signature. Treat them as test builds. Each artifact directory ships a
          `BUILD_LABELS.txt` that records this.

          Verify the downloaded files against the adjacent `.sha256` sidecars
          before running them. Platform build labels are attached as
          `BUILD_LABELS-<artifact>.txt` files.
          NOTES
          ((${#files[@]})) || { echo 'No installer artifacts were downloaded.' >&2; exit 1; }
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Vibe Coded Emulator $TAG (unsigned staging builds)" \
            --notes-file release-notes.md \
            "${files[@]}"
