# Public-test installer publication (tags only).
#
# This is the only workflow with write access. It runs after a version tag is
# pushed, waits for the read-only cross-platform build/test workflow, then
# publishes the clearly labeled public-test release and exact artifact catalog.
#
# Security posture:
#   - Triggered only by a pushed version tag; it never runs on pull requests.
#   - Build jobs retain contents: read; only the final publish job gets
#     contents: write so it can attach the tested artifacts.
#   - No signing identity or repository secrets are used.
#   - Third-party actions are pinned to immutable full commit SHAs.
name: native-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-build.yml

  publish-public-test-release:
    name: Publish public-test release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Download the exact installer artifacts (exclude test-only diagnostics)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-dmg
          path: dist/macos-dmg
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe
          path: dist/windows-exe
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-deb
          path: dist/linux-deb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-flatpak
          path: dist/linux-flatpak
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: dist/android-apk
      - name: Scan built artifacts for secrets and private data
        env:
          REPORT_JSON: ${{ runner.temp }}/release-artifact-security.json
        run: |
          set -euo pipefail
          python3 tools/release-artifact-scan.py \
            --config .gitleaks.toml \
            --exact-allowlist tools/release-artifact-allowlist.json \
            --json "$REPORT_JSON" \
            dist
          python3 - "$REPORT_JSON" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          skipped = report["summary"]["skipped"]
          if skipped:
              print(
                  f"Artifact scan skipped {skipped} file(s); refusing publication.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
      - name: Retain artifact security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifact-security-report
          path: ${{ runner.temp }}/release-artifact-security.json
          if-no-files-found: ignore
      - name: Collect and publish public-test release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Keep platform packages, checksums, and labels; exclude acceptance
          # APKs and short-lived emulator diagnostics.
          while IFS= read -r -d '' label; do
            platform="$(basename "$(dirname "$label")")"
            cp "$label" "dist/BUILD_LABELS-${platform}.txt"
          done < <(find dist -type f -name BUILD_LABELS.txt -print0)
          mapfile -d '' files < <(find dist -type f \
            \( -name '*.dmg' -o -name '*.dmg.sha256' \
            -o -name '*.deb' -o -name '*.deb.sha256' \
            -o -name '*.flatpak' -o -name '*.flatpak.sha256' \
            -o -name '*.exe' -o -name '*.exe.sha256' \
            -o -name '*-android-arm64-staging.apk' -o -name '*-android-arm64-staging.apk.sha256' \
            -o -name '*-android-arm64-staging.aab' -o -name '*-android-arm64-staging.aab.sha256' \
            -o -name 'BUILD_LABELS-*.txt' \) -print0 | sort -z)
          printf '%s\n' "${files[@]}"
          echo '--- labels ---'
          find dist -name BUILD_LABELS.txt -exec sh -c 'echo "[$1] $(cat "$1")"' _ {} \;

          # Generate the catalog from the bytes this run produced, so the
          # download page and the Linux installers can never serve a stale or
          # hand-edited entry. `runtime_status` stays generic on purpose: the
          # reviewing human replaces it with what was actually exercised.
          python3 tools/build-release-catalog.py \
            --source-commit "$GITHUB_SHA" \
            --releases dist \
            --release-candidate "$TAG-public-test" \
            --runtime-status "Hosted build/smoke results are linked; unexercised behavior remains UNVERIFIED." \
            || { echo 'Catalog generation failed; refusing to publish without it.' >&2; exit 1; }

          cat > release-notes.md <<'NOTES'
          Vibe Coded Emulator 3.6.11 public-test installers, built from this GitHub source revision.

          **These are unfinished, unsigned public-test builds.** macOS bundles
          are ad-hoc signed only and not notarized, Android APKs use the
          auto-generated Android debug key, and the Linux DEB/Flatpak and
          Windows NSIS packages carry no distribution or Authenticode
          signature. Treat them as test builds. Each artifact directory ships a
          `BUILD_LABELS.txt` that records this.

          Verify the downloaded files against the adjacent `.sha256` sidecars
          before running them. Platform build labels are attached as
          `BUILD_LABELS-<artifact>.txt` files, and `catalog.json` records the
          exact source revision, size and SHA-256 of every artifact.

          ## First launch on an unsigned build

          - **macOS**: Gatekeeper blocks an unnotarized app on first launch.
            Right-click (or Control-click) the app in Finder and choose **Open**,
            then confirm. Do not disable Gatekeeper system-wide.
          - **Windows**: SmartScreen warns on an unsigned installer. Choose
            **More info → Run anyway** after verifying the checksum.
          - **Android**: install the APK after allowing "install unknown apps"
            for your browser or file manager. It uses the auto-generated debug
            key, so it is a test build rather than a Play-distributed one.

          ## Supported systems

          | System | macOS | Windows | Linux | Android |
          | --- | --- | --- | --- | --- |
          | GBA (mGBA) | yes | yes | yes | yes |
          | NDS (melonDS DS) | yes | yes | yes | yes |
          | 3DS (Azahar) | yes | requires Vulkan | requires Vulkan | yes |

          3DS uses the Azahar hardware renderer and needs a working Vulkan
          driver off macOS; the portable runtime rejects the OpenGL fallback for
          3DS by design. NDS runs melonDS in software-render mode, the accepted
          default for the pinned core. VCE 3.6.11 is an account-free core-only public-test product; Phone Controller,
          LAN Sync and Switch/Eden gameplay are not enabled or supported by this candidate.

          ## Test coverage

          The GitHub Actions run records package builds and hosted smoke or instrumentation lanes for this source.
          Unexercised behavior, audible output, sustained gameplay and physical-device coverage remain UNVERIFIED.
          Those gaps do not block public testing.

          | Platform | Status | Evidence |
          | --- | --- | --- |
          | macOS | UNVERIFIED | |
          | Windows | UNVERIFIED | |
          | Linux | UNVERIFIED | |
          | Android | UNVERIFIED | |
          NOTES
          ((${#files[@]})) || { echo 'No installer artifacts were downloaded.' >&2; exit 1; }
          gh release create "$TAG" \
            --prerelease \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vibe Coded Emulator $TAG (public-test builds)" \
            --notes-file release-notes.md \
            "${files[@]}" dist/catalog.json
