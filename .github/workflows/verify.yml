# Private-repository CI.
#
# This runs the same gate a developer runs locally, so a green run here means
# `bash tools/verify-project.sh` would also pass. It is deliberately minimal:
# the source gate, the browser-semantics lane and the publication gate, plus the
# aggregate `release-gate` job that `main` requires. Native packages are not
# built here; that needs the pinned core artifacts and per-platform toolchains,
# and claiming otherwise would be unverified.
#
# The public snapshot gets its own workflows from tools/publication/.github/;
# this file is not published.
name: verify

# GitHub Actions is the build and test authority for VCE. The private-repository
# gate below mirrors tools/verify-project.sh exactly, so a green run here means
# the local gate would also pass. Cross-platform packaging lives in the release
# train on its dedicated builders, not here.

on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
  # A merge queue re-runs the required checks on the queued merge commit; without
  # this trigger the queue would report `Release gate` as Expected and never
  # produce it.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project-verify:
    name: Project verify gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Claim the emulator-loop throughput budget instead of letting
    # tests/an3ctl.test.mjs skip it. The portable player is vendored in-tree and
    # verify-project.sh regenerates the git-ignored fixture on a clean checkout;
    # docs/QUALITY.md records that this is emulator-loop throughput, not frame
    # pacing or audio acceptance.
    env:
      AN3_PLAYER: ${{ github.workspace }}/native-offline/vendor/runtime/linux-x86_64/an3-offline-native
      AN3_FIXTURE: ${{ github.workspace }}/work/fixtures/an3-synthetic-gba.gba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native-offline/package-lock.json
      - name: Install native guard headers and the player runtime
        run: |
          sudo apt-get update
          # The vendored player is dynamically linked. Without its runtime
          # libraries the emulator loop exits 127, and the gate then fails
          # loudly instead of letting the throughput budget be skipped:
          # libSDL2 was the library missing from the ubuntu-24.04 image
          # (run 39035517162). The probe below names any other missing soname
          # in the job log so the next failure is diagnosable in one look.
          sudo apt-get install -y --no-install-recommends libvulkan-dev libsdl2-2.0-0
          missing=$(ldd "$AN3_PLAYER" | awk '/not found/ {print $1}')
          if [ -n "$missing" ]; then
            printf '::error title=Player runtime libraries::missing sonames: %s\n' \
              "$(echo "$missing" | tr '\n' ' ')"
            exit 1
          fi
      - name: Install native JS dependencies
        working-directory: native-offline
        run: npm ci
      - name: Run tools/verify-project.sh
        run: |
          set +e
          bash tools/verify-project.sh > "$RUNNER_TEMP/project-verify.log" 2>&1
          result=$?
          python3 - "$RUNNER_TEMP/project-verify.log" "$result" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          print(text)
          if sys.argv[2] != "0":
              blocks = re.findall(r"(?m)^(?:FAIL:|ERROR:|Documentation reference check FAILED:)[\s\S]*?(?=\n={10}|\n-{10}|\nRESULT:|\Z)", text)
              for block in blocks[:12] or [text[-5000:]]:
                  message = block[:5000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Project verification::" + message)
          PY
          exit "$result"
      - name: Confirm the gate left the tree clean
        run: git diff --exit-code

  browser-runtime:
    name: Browser semantics and representative journey
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned browser CLI on the disposable runner
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund @playwright/cli@0.1.22
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "$RUNNER_TEMP/browser/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Exercise actual browser semantics, recovery and responsive layout
        env:
          AN3_WEB_RUNTIME: '1'
        run: timeout --kill-after=5s 210s node --test tests/web-runtime.test.mjs
      - name: Preserve representative states and failure trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-ui-evidence
          path: work/ui-runtime/
          retention-days: 7

  publication-gate:
    name: Publication gate (fail closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans base^..head; shallow checkout cannot resolve base^.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gitleaks and scan source history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pin the CLI verified with the rule-scoped allowlist regressions.
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_CONFIG: tools/publication/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Build the public snapshot
        run: bash tools/build-public-snapshot.sh --output work/public-snapshot
      - name: Scan the snapshot
        # This is the same gate tools/publish-github.sh runs before it can push.
        # It must fail closed: a scanner that cannot run blocks publication.
        run: |
          set +e
          bash tools/publication-check.sh work/public-snapshot > "$RUNNER_TEMP/publication.log" 2>&1
          result=$?
          python3 - "$RUNNER_TEMP/publication.log" "$result" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          print(text)
          if sys.argv[2] != "0":
              message = text[-5000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Publication gate::" + message)
          PY
          exit "$result"
      - name: Publication gate regression tests
        run: python3 -m unittest tests.test_publication_gate -v

  release-gate:
    name: Release gate
    # The aggregate required status check on `main`. `if: always()` plus the
    # complete `needs` list is the point: a skipped, cancelled or failed lane
    # makes this job fail too. A required check that reads green while a lane
    # never ran is exactly the defect this job exists to prevent.
    if: always()
    needs:
      - project-verify
      - browser-runtime
      - publication-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required lane must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os

          needs = json.loads(os.environ["NEEDS"])
          bad = {name: entry.get("result") for name, entry in needs.items()
                 if entry.get("result") != "success"}
          if bad:
              named = ", ".join(f"{name}={result}" for name, result in sorted(bad.items()))
              print(f"::error title=Release gate::lane(s) not successful: {named}")
              raise SystemExit(1)
          print(f"Release gate: all {len(needs)} required lane(s) succeeded")
          PY
