# Native installers build (reusable).
#
# This workflow produces the five native packages from source on matching
# GitHub-hosted runners by calling the repository's canonical staging
# entrypoint, `tools/release-train.sh --staging build <platform>`. It never
# re-implements a build route of its own.
#
# Security posture for maintainers:
#   - `permissions: contents: read`; this file references no `secrets.*`.
#   - It only builds and uploads workflow artifacts. It never deploys, never
#     creates a release and never writes to the repository.
#   - No production signing identity is used. macOS bundles are ad-hoc signed
#     (`codesign --sign -`) and Android APKs use the auto-generated Android
#     debug key; every artifact group ships a `BUILD_LABELS.txt` that says so.
#   - Third-party actions are pinned to immutable full commit SHAs. Update them
#     deliberately, never by moving tag.
name: native-build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-offline/**'
      - 'native/**'
      - 'tools/release-train.sh'
      - '.github/workflows/native-build.yml'
  push:
    branches: [main]
    paths:
      - 'native-offline/**'
      - 'native/**'
      - 'tools/release-train.sh'
      - '.github/workflows/native-build.yml'

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-dmg:
    name: macOS DMG
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: native-offline/package-lock.json
      - name: Install JS dependencies
        working-directory: native-offline
        run: npm ci
      - name: Build macOS DMG
        run: bash tools/release-train.sh --staging build macos
      - name: Label and hash artifact
        run: |
          set -euo pipefail
          dmg="$(find native-offline/releases -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg" || { echo 'macOS DMG was not produced.' >&2; exit 1; }
          shasum -a 256 "$dmg" > "$dmg.sha256"
          printf 'macOS DMG: UNSIGNED for distribution (ad-hoc code signature only). Not notarized.\n' \
            > native-offline/releases/BUILD_LABELS.txt
          cat "$dmg.sha256" native-offline/releases/BUILD_LABELS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: |
            native-offline/releases/*.dmg
            native-offline/releases/*.dmg.sha256
            native-offline/releases/BUILD_LABELS.txt
          if-no-files-found: error

  android-apk:
    name: Android APK
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CI: 'true'
      NDK_VERSION: '26.3.11579264'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: native-offline/package-lock.json
      - name: Provision Android NDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          test -d "$sdk_root" || { echo "Android SDK not found at $sdk_root" >&2; exit 1; }
          if [ ! -d "$sdk_root/ndk/$NDK_VERSION" ]; then
            yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "NDK_HOME=$sdk_root/ndk/$NDK_VERSION"
          } >> "$GITHUB_ENV"
      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android
      - name: Install JS dependencies
        working-directory: native-offline
        run: npm ci
      - name: Initialize Android project when absent
        working-directory: native-offline
        run: |
          set -euo pipefail
          # Only product-specific Android files are committed; the Gradle
          # project is regenerated by Tauri when it is not present.
          if [ ! -x src-tauri/gen/android/gradlew ]; then
            npm run android:init
          fi
      - name: Build Android APK
        run: bash tools/release-train.sh --staging build android
      - name: Label and hash artifact
        run: |
          set -euo pipefail
          apk="$(find native-offline/releases -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk" || { echo 'Android APK was not produced.' >&2; exit 1; }
          shasum -a 256 "$apk" > "$apk.sha256"
          printf 'Android APK: staging build signed with the auto-generated Android debug key, not a production identity.\n' \
            > native-offline/releases/BUILD_LABELS.txt
          cat "$apk.sha256" native-offline/releases/BUILD_LABELS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: |
            native-offline/releases/*.apk
            native-offline/releases/*.apk.sha256
            native-offline/releases/BUILD_LABELS.txt
          if-no-files-found: error

  linux-deb:
    name: Linux DEB
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: native-offline/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev file patchelf \
            libsdl2-dev libvulkan-dev mesa-common-dev libgl1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install JS dependencies
        working-directory: native-offline
        run: npm ci
      - name: Build Debian package
        run: bash tools/release-train.sh --staging build linux-deb
      - name: Label and hash artifact
        run: |
          set -euo pipefail
          deb="$(find native-offline/releases -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb" || { echo 'Linux DEB was not produced.' >&2; exit 1; }
          sha256sum "$deb" > "$deb.sha256"
          printf 'Linux DEB: UNSIGNED package. Not distribution-signed.\n' \
            > native-offline/releases/BUILD_LABELS.txt
          cat "$deb.sha256" native-offline/releases/BUILD_LABELS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-deb
          path: |
            native-offline/releases/*.deb
            native-offline/releases/*.deb.sha256
            native-offline/releases/BUILD_LABELS.txt
          if-no-files-found: error

  linux-flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: native-offline/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev file patchelf \
            libsdl2-dev libvulkan-dev mesa-common-dev libgl1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            flatpak flatpak-builder
      - name: Install Flatpak runtime and SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Install JS dependencies
        working-directory: native-offline
        run: npm ci
      - name: Build the DEB consumed by the Flatpak manifest
        run: bash tools/release-train.sh --staging build linux-deb
      - name: Build Flatpak bundle
        run: bash tools/release-train.sh --staging build linux-flatpak
      - name: Label and hash artifact
        run: |
          set -euo pipefail
          flatpak_bundle="$(find native-offline/releases -maxdepth 1 -name '*.flatpak' -print -quit)"
          test -n "$flatpak_bundle" || { echo 'Linux Flatpak was not produced.' >&2; exit 1; }
          sha256sum "$flatpak_bundle" > "$flatpak_bundle.sha256"
          printf 'Linux Flatpak: UNSIGNED bundle. Not signed with a distribution Flatpak key.\n' \
            > native-offline/releases/BUILD_LABELS.txt
          cat "$flatpak_bundle.sha256" native-offline/releases/BUILD_LABELS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-flatpak
          path: |
            native-offline/releases/*.flatpak
            native-offline/releases/*.flatpak.sha256
            native-offline/releases/BUILD_LABELS.txt
          if-no-files-found: error

  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: native-offline/package-lock.json
      - name: Install MSYS2 UCRT64 GTK/SDL/Vulkan toolchain
        shell: bash
        run: |
          set -euo pipefail
          msys2=/c/msys64
          test -x "$msys2/usr/bin/bash.exe" || { echo 'MSYS2 is missing at C:/msys64.' >&2; exit 1; }
          "$msys2/usr/bin/bash.exe" -lc \
            "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader"
      - name: Verify Vulkan SDK
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path "$env:VULKAN_SDK/Include/vulkan/vulkan.h") -or -not (Test-Path "$env:VULKAN_SDK/Lib/vulkan-1.lib")) {
            throw 'VULKAN_SDK (LunarG) headers and x64 import library are required on the runner.'
          }
      - name: Build portable Windows runtime
        shell: pwsh
        run: native-offline/scripts/build-windows-runtime.ps1 -MsysRoot 'C:\msys64'
      - name: Build NSIS installer
        shell: bash
        run: bash tools/release-train.sh --staging build windows
      - name: Label and hash artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem native-offline/releases -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'Windows EXE was not produced.' }
          "Windows EXE: UNSIGNED NSIS installer. Not Authenticode-signed." |
            Set-Content -Encoding ascii native-offline/releases/BUILD_LABELS.txt
          Get-Content native-offline/releases/BUILD_LABELS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-exe
          path: |
            native-offline/releases/*.exe
            native-offline/releases/*.exe.sha256
            native-offline/releases/BUILD_LABELS.txt
          if-no-files-found: error
