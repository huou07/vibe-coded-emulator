    name: Android Sync runner limitation
    needs: android-apk
    runs-on: ubuntu-24.04
    steps:
      - name: Record unsupported external-peer topology
        run: |
          {
            echo 'ANDROID_SYNC=UNVERIFIED_RUNNER_LIMITATION'
            echo 'The authenticated Android-to-macOS Sync test requires a live paired AN3 peer and matching generated save-state fixture. This hosted job provisions neither endpoint nor private pairing material, so no Sync PASS is claimed.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
